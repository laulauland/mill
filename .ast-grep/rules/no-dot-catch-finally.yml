id: no-dot-catch-finally
language: TypeScript
severity: error
message: Prefer Effect error/finalizer combinators or await/then error continuations at adapter edges over Promise .catch/.finally chains.
ignores:
  - "**/*.test.ts"
  - "packages/core/src/run-platform.adapter.ts"
  - "packages/pi-mill/platform.adapter.ts"
  - "packages/pi-mill/runtime.adapter.ts"
  - "packages/pi-mill/executors/program-executor.adapter.ts"
  - "packages/pi-mill/.vendor/**"
  - "packages/pi-mill/.pi-skills/**"
rule:
  any:
    - all:
        - pattern: "$A.catch($$$B)"
        - not:
            pattern: "Effect.catch($$$B)"
    - pattern: "$A.finally($$$B)"
