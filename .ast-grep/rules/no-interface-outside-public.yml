id: no-interface-outside-public
language: TypeScript
severity: error
message: Interfaces are allowed only in public boundary modules and declaration files.
ignores:
  - "**/*.api.ts"
  - "**/*.d.ts"
  - "**/*.effect.ts"
  - "**/*.service.ts"
  - "packages/*/src/index.ts"
  - "packages/*/src/types.ts"
  - "packages/*/src/services/*.ts"
  - "packages/*/src/schemas/*.ts"
rule:
  pattern: "interface $NAME { $$$BODY }"
