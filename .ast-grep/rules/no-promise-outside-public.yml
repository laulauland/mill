id: no-promise-outside-public
language: TypeScript
severity: error
message: Promise contracts are allowed only in boundary APIs.
ignores:
  - "**/*.api.ts"
  - "**/*.d.ts"
  - "**/*.test.ts"
  - "packages/*/src/index.ts"
  - "packages/*/src/types.ts"
  - "packages/*/src/test-runtime.ts"
  - "packages/*/src/mill.ts"
  # pi-tui is a special imperative TUI library: it owns its own render loop
  # and uses requestRender + process.nextTick callbacks instead of Effect.
  # watch-tui.ts is the thin adapter that bridges pi-tui into Effect, so a
  # raw Promise wrap is the only honest shape at this boundary.
  - "packages/cli/src/watch-tui.ts"
rule:
  any:
    - pattern: "Promise<$T>"
    - pattern: "$A: Promise<$T>"
    - pattern: "type $NAME = ($$$ARGS) => Promise<$T>"
    - pattern: "($$$ARGS) => Promise<$T>"
    - pattern: "new Promise<$T>($A)"
    - pattern: "new Promise($A)"
