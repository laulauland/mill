id: no-runtime-runpromise-outside-boundary
language: TypeScript
severity: error
message: Effect.runPromise bridge is allowed only in public boundary and CLI entry adapters.
ignores:
  - "**/*.api.ts"
  - "**/*.test.ts"
  - "packages/*/src/index.ts"
  - "packages/*/src/test-runtime.ts"
  - "packages/*/src/mill.ts"
rule:
  any:
    - pattern: "Effect.runPromise($A)"
    - pattern: "Effect.runPromiseExit($A)"
