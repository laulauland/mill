id: no-public-import-internal
language: TypeScript
severity: error
message: Public API modules must not import private effect/schema/codec implementation modules directly.
files:
  - "**/*.api.ts"
ignores:
  - "**/*.test.ts"
  - "**/run.api.ts"
  - "**/task-actor.api.ts"
rule:
  any:
    - pattern: 'import $$$A from "$MODULE"'
    - pattern: "import '$MODULE'"
    - pattern: 'import "$MODULE"'
    - pattern: 'export * from "$MODULE"'
    - pattern: 'export { $$$A } from "$MODULE"'
    - pattern: 'export type { $$$A } from "$MODULE"'
constraints:
  MODULE:
    regex: "(^|/)[^/]+\\.(effect|schema|codec)(\\.ts)?$"
