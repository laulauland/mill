id: no-node-child-process
language: TypeScript
severity: error
message: Use effect/unstable/process/ChildProcess with @effect/platform-bun services, or isolate process control in an explicit final-boundary adapter.
ignores:
  - "**/*.test.ts"
  - "packages/core/src/run-platform.adapter.ts"
rule:
  any:
    - pattern: 'import $$$A from "node:child_process"'
    - pattern: 'import { $$$A } from "node:child_process"'
    - pattern: "process.kill($$$A)"
